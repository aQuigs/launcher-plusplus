exclude: '^\.claude/'
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-symlinks
      - id: check-vcs-permalinks
      - id: check-xml
      - id: check-yaml

      - id: destroyed-symlinks
      - id: detect-aws-credentials
        args: ['--allow-missing-credentials']
      - id: detect-private-key
      - id: pretty-format-json
        args: ['--no-sort-keys', '--indent=4', '--autofix']

      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: theme-colours-only
        name: Colours come from the theme
        language: pygrep
        entry: '\bColor\s*\(|\bColor\.(Black|White|Gray|DarkGray|LightGray|Red|Green|Blue|Yellow|Cyan|Magenta|hsv|hsl|parseColor|rgb|argb|valueOf|BLACK|WHITE|GRAY|DKGRAY|LTGRAY|RED|GREEN|BLUE|YELLOW|CYAN|MAGENTA)\b|\.(surface\w*|background)\.copy\('
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/theme/
      - id: panel-ground-only
        name: Full-screen views and pop-ups take their ground from PanelGround
        language: pygrep
        entry: '\bsurfaceDim\b|\bLocalPanelMark\b|\bdrawBackdrop\(|(?<![\w.])(AlertDialog|DropdownMenu)\('
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/(theme/|Panel\.kt$|Popups\.kt$|\w+Art\.kt$)
      - id: launcher-buttons
        name: Text buttons are a LauncherButton, which takes its look from the ground it is on
        language: pygrep
        entry: '(?<!\w)(Text|FilledTonal|Filled|Outlined|Elevated)?Button\s*\('
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/Grounds\.kt$
      - id: launcher-surfaces
        name: Boxes are a Pane, choices a ChoiceRow, fills from BoxColors and corners from the theme's shapes
        language: pygrep
        entry: '\.surface\w*\b|(RoundedCorner|CutCorner)Shape\s*\(|(?<![\w.])(?<!class )(Surface|Card|ElevatedCard|OutlinedCard|SegmentedButton|FilterChip|InputChip)\s*\('
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/(theme/|Grounds\.kt$|ChoiceRow\.kt$|Panel\.kt$|\w+Art\.kt$)
      - id: launcher-pop-up-kinds
        name: Dialogs are an InfoDialog, ConfirmDialog, NameDialog or ChoiceDialog, menus a GroundMenu of MenuRows, notes a Notice
        language: pygrep
        entry: '(?<![\w.])(DropdownMenuItem|BasicAlertDialog|Dialog|Popup|ModalBottomSheet|Snackbar)\s*\(|\bToast\b'
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/Popups\.kt$
      - id: sideways-scroll
        name: A row that scrolls sideways is a sidewaysScroll, which shows there is more
        language: pygrep
        entry: '\.horizontalScroll\(|\bLazyRow\s*\('
        files: ^app/src/main/kotlin/.*\.kt$
        exclude: ^app/src/main/kotlin/com/sqftware/orbitlauncher/ui/theme/Fades\.kt$
      - id: check-markdown
        name: check-markdown
        entry: markdownlint -c ./.markdownlintrc --ignore .claude
        language: system
        files: \.(md|mdown|markdown)$
      - id: gradle-checks
        name: Run Gradle lint and unit tests
        entry: ./gradlew lintDebug testDebugUnitTest -q
        language: system
        pass_filenames: false
        files: \.(kt|kts|gradle|toml|xml|properties)$
        stages: [pre-commit]
