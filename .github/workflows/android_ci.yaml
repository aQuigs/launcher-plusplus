# Shared workflow: sync-common keeps every repo's copy identical to the original in the tooling checkout; edit the original only.
name: android-ci
run-name: Building, linting and unit testing the Android app
on: [push]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build, lint and run the unit tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
