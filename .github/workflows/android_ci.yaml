# Shared workflow: sync-common keeps every repo's copy identical to the original in the tooling checkout; edit the original only.
name: android-ci
on: [push]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # The default provider is proprietary and free only for public repos, and copies of this workflow can be private.
          cache-provider: basic

      - name: Build, lint and run the unit tests
        run: ./gradlew assembleDebug assembleDebugAndroidTest lintDebug testDebugUnitTest

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: '**/build/reports/'
